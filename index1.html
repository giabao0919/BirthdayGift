
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🎁 Hộp Quà</title>
<style>
body {
    background: #0b1220;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: white;
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
}
#gift {
    width: 200px;
    cursor: pointer;
    animation: bounce 1s infinite ease-in-out;
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
.message {
    display: none;
    text-align: center;
}
canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>
<body>
<img id="gift" src="gift_box.png" alt="gift">
<div class="message">
    <h1>🎉 HAPPY BIRTHDAY 🎉</h1>
    <h2>Chúc mừng sinh nhật!</h2>
    <p>Chúc bảo thật nhiều sức khỏe, niềm vui và thành công! 🎂</p>
    <button onclick="resetGift()">↩️ Đóng lại hộp quà</button>
</div>
<canvas id="confetti"></canvas>
<script>
// simple confetti effect
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;
let confetti = [];

function spawnConfetti() {
    confetti = Array.from({length: 200}, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * -innerHeight,
        r: Math.random()*6+3,
        c: ["#ef4444","#f59e0b","#84cc16","#22c55e","#06b6d4","#3b82f6","#8b5cf6","#ec4899"][Math.floor(Math.random()*8)],
        vy: Math.random()*3+2,
        vx: Math.random()*2-1
    }));
}

function drawConfetti() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let p of confetti) {
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, p.r, p.r);
        p.x += p.vx;
        p.y += p.vy;
        if (p.y > innerHeight) p.y = -10;
    }
    requestAnimationFrame(drawConfetti);
}

const gift = document.getElementById("gift");
const msg = document.querySelector(".message");

gift.addEventListener("click", () => {
    gift.style.display = "none";
    msg.style.display = "block";
    spawnConfetti();
    drawConfetti();
});

function resetGift() {
    msg.style.display = "none";
    gift.style.display = "block";
    confetti = [];
    ctx.clearRect(0,0,canvas.width,canvas.height);
}
</script>
</body>
</html>
