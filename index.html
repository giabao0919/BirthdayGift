<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🎁 Hộp Quà</title>
<style>
body {
    margin: 0;
    background: #0b1220;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: white;
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
}
h1, h2, p { margin: 8px 0; }
#gift {
    width: 240px;
    cursor: pointer;
    animation: bounce 1s infinite ease-in-out;
    user-select: none;
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
.message {
    display: none;
    text-align: center;
}
button {
    background: #1f2937;
    color: #e5e7eb;
    border: none;
    padding: 8px 14px;
    margin-top: 10px;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
}
button:hover {
    background: #374151;
}
canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
</style>
</head>
<body>
<h2 id="title">Nhấp vào hộp quà để mở 🎁</h2>
<img id="gift" src="gift_box.png" alt="gift">
<div class="message">
    <h1>🎉 HAPPY BIRTHDAY 🎉</h1>
    <h2 style="color:#fef3c7;">Chúc mừng sinh nhật!</h2>
    <p style="color:#c7d2fe;">Chúc bảo thật nhiều sức khỏe, niềm vui và thành công! 🎂</p>
    <button onclick="resetGift()">↩️ Đóng lại hộp quà</button>
</div>
<canvas id="confetti"></canvas>
<script>
// Canvas setup
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];
let confettiActive = false;
const COLORS = ["#ef4444","#f59e0b","#84cc16","#22c55e",
                "#06b6d4","#3b82f6","#8b5cf6","#ec4899"];

function spawnConfetti(n=220) {
    confetti = Array.from({length: n}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        r: Math.random()*6+3,
        c: COLORS[Math.floor(Math.random()*COLORS.length)],
        vy: Math.random()*3+2,
        vx: Math.random()*2-1
    }));
}

function drawConfetti() {
    if (!confettiActive) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let p of confetti) {
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, p.r, p.r);
        p.x += p.vx;
        p.y += p.vy;
        if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random()*canvas.width;
        }
    }
    requestAnimationFrame(drawConfetti);
}

// DOM elements
const gift = document.getElementById("gift");
const msg = document.querySelector(".message");
const title = document.getElementById("title");

gift.addEventListener("click", () => {
    gift.style.display = "none";
    title.style.display = "none";
    msg.style.display = "block";
    confettiActive = true;
    spawnConfetti();
    drawConfetti();
});

function resetGift() {
    msg.style.display = "none";
    gift.style.display = "block";
    title.style.display = "block";
    confettiActive = false;
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
